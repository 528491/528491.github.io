<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Privacy policy for Deltify — a local-only iOS workout tracker.">
    <title>Privacy Policy — Deltify</title>
    <style>
        :root {
            --bg: #1C1C1E;
            --surface: #2C2C2E;
            --text: #FFFFFF;
            --muted: rgba(255, 255, 255, 0.65);
            --accent: #0A84FF;
            --rule: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
                "Helvetica Neue", Arial, sans-serif;
            font-size: 17px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        main {
            max-width: 720px;
            margin: 0 auto;
            padding: 56px 24px 80px;
        }

        header {
            text-align: center;
            margin-bottom: 48px;
            padding-bottom: 32px;
            border-bottom: 1px solid var(--rule);
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0;
        }

        .logo .delta {
            color: var(--accent);
            display: inline-block;
            margin-right: 6px;
        }

        /* ─── Termly snippet overrides ─────────────────────────────────
           Force Termly's injected content to inherit the page's dark
           theme. Termly renders light-background text by default.
        ──────────────────────────────────────────────────────────────── */
        #termly-code-snippet-support,
        #termly-code-snippet-support * {
            background-color: var(--bg) !important;
            color: var(--text) !important;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
                "Helvetica Neue", Arial, sans-serif !important;
        }

        #termly-code-snippet-support a {
            color: var(--accent) !important;
        }

        #termly-code-snippet-support h1,
        #termly-code-snippet-support h2,
        #termly-code-snippet-support h3 {
            color: var(--text) !important;
            font-weight: 700 !important;
            letter-spacing: -0.01em !important;
        }

        footer {
            margin-top: 56px;
            padding-top: 24px;
            border-top: 1px solid var(--rule);
            text-align: center;
            color: var(--muted);
            font-size: 14px;
        }

        footer p {
            margin: 0;
            color: var(--muted);
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
        }

        footer a:hover,
        footer a:focus {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            main {
                padding: 32px 20px 56px;
            }

            .logo {
                font-size: 28px;
            }

            body {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <main>

        <header>
            <div class="logo"><span class="delta">&Delta;</span>Deltify</div>
        </header>


         <div name="termly-embed" data-id="fb8fe108-0088-4794-acfa-da4d0f2ad3c5"></div>
        <script type="text/javascript">(function(d, s, id) {
        var js, tjs = d.getElementsByTagName(s)[0];
        if (d.getElementById(id)) return;
        js = d.createElement(s); js.id = id;
        js.src = "https://app.termly.io/embed-policy.min.js";
        tjs.parentNode.insertBefore(js, tjs);
        }(document, 'script', 'termly-jssdk'));</script>


        <footer>
            <p>&copy; 2026 Deltify LLC &middot; <a href="mailto:jacob@deltify.io">jacob@deltify.io</a></p>
        </footer>

    </main>
</body>
</html>
